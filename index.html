<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        #chat-messages {
            position: relative; /* Needed for the background pseudo-element */
            z-index: 1;
        }
        /* This is the new style for your background logo */
        #chat-messages::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/2/22/Krop_Digital_Media_Entertainment_Corporation_%28KDEC%29_company_icon.svg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 250px;
            opacity: 0.08; /* Makes the logo very subtle */
            z-index: -1; /* Puts the logo behind the chat text */
        }
        #chat-messages::-webkit-scrollbar {
            width: 8px;
        }
        #chat-messages::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        #chat-messages::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .ai-spinner {
            border: 2px solid rgba(0,0,0,.1);
            border-left-color: #4f46e5;
            border-radius: 50%;
            width: 1rem;
            height: 1rem;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .system-message {
            text-align: center;
            color: #64748b; /* slate-500 */
            font-style: italic;
            font-size: 0.875rem;
            margin: 0.5rem 0;
        }
    </style>
</head>
<body class="bg-slate-100">

    <div id="app-container" class="flex flex-col h-screen max-w-4xl mx-auto bg-white shadow-2xl">

        <!-- Header -->
        <header class="bg-slate-800 text-white p-4 flex items-center justify-between shadow-md z-10">
            <div class="flex items-center gap-4">
                 <h1 class="text-xl md:text-2xl font-bold">Global Chat Room</h1>
                 <button id="summarize-btn" title="Summarize conversation with AI" class="bg-slate-700 hover:bg-slate-600 text-sm font-semibold px-3 py-1 rounded-full transition duration-200 flex items-center gap-2">
                    ✨ Summarize
                </button>
            </div>
            <div id="user-info" class="text-right"></div>
        </header>

        <!-- Chat Messages Area -->
        <main id="chat-messages" class="flex-grow p-4 md:p-6 overflow-y-auto">
            <!-- Messages will be dynamically inserted here -->
            <div class="text-center text-slate-400">Loading messages...</div>
        </main>

        <!-- Message Input Form -->
        <footer class="bg-slate-50 p-4 border-t border-slate-200">
            <form id="message-form" class="flex items-center space-x-3">
                <input type="text" id="message-input" placeholder="Type a message or use /ai [your question]" autocomplete="off" required
                    class="flex-grow w-full px-4 py-2 bg-white border border-slate-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200">
                <button type="submit"
                    class="bg-blue-600 text-white rounded-full p-3 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200 shadow">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transform rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </button>
            </form>
        </footer>
    </div>

    <!-- Username Modal -->
    <div id="username-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 transition-opacity duration-300">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-11/12 max-w-sm text-center transform scale-95 transition-transform duration-300">
            <h2 class="text-2xl font-bold text-slate-800 mb-4">Enter the Chat</h2>
            <p class="text-slate-600 mb-6">Please choose a username to display.</p>
            <form id="username-form">
                <input type="text" id="username-input" placeholder="Your Username" required
                    class="w-full px-4 py-3 bg-slate-100 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4">
                <button type="submit"
                    class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-200 shadow-md">Join Chat</button>
            </form>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, serverTimestamp, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =================================================================
        // ============== YOUR KEYS ARE ALREADY INCLUDED ===================
        // =================================================================
        
        // 1. YOUR FIREBASE CONFIG
        const firebaseConfig = {
          apiKey: "AIzaSyD8wWuUeOjyzFk8Ym-JT8iAeVAypEYbC1g",
          authDomain: "mychatapp-4eb1a.firebaseapp.com",
          projectId: "mychatapp-4eb1a",
          storageBucket: "mychatapp-4eb1a.appspot.com",
          messagingSenderId: "194029120923",
          appId: "1:194029120923:web:4a43c1981c2ff479d6053e",
          measurementId: "G-VRFYPYNLWH"
        };

        // 2. YOUR GEMINI API KEY
        const GEMINI_API_KEY = "AIzaSyBX-Ns0Bra6RtsCQ7oI5CepiuWwazHQ3ss";

        // =================================================================
        
        const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${GEMINI_API_KEY}`;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-chat-app';

        // --- DOM Elements ---
        const chatMessages = document.getElementById('chat-messages');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const usernameModal = document.getElementById('username-modal');
        const usernameForm = document.getElementById('username-form');
        const usernameInput = document.getElementById('username-input');
        const userInfo = document.getElementById('user-info');
        const summarizeBtn = document.getElementById('summarize-btn');
        
        // --- App State ---
        let db, auth;
        let username = '';
        let userId = '';
        let currentMessages = [];
        
        // --- Main App Logic ---
        async function initialize() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                setLogLevel('Debug');
                await setupAuth();
                usernameModal.classList.remove('opacity-0');
                usernameModal.querySelector('div').classList.remove('scale-95');
            } catch (error) {
                console.error("Initialization failed:", error);
            }
        }

        async function setupAuth() {
            // We will now ONLY use anonymous sign-in.
            // The custom token from the preview environment is ignored to prevent the mismatch error.
            try {
                await signInAnonymously(auth);
                userId = auth.currentUser.uid;
                console.log("Signed in anonymously.");
            } catch (error) {
                console.error("Anonymous sign-in failed:", error);
                if (error.code === 'auth/configuration-not-found') {
                    displayError("Configuration Error: Please enable 'Anonymous' sign-in in your Firebase project's Authentication settings.");
                } else {
                    displayError("Could not connect to the chat service. Please check your Firebase configuration and internet connection.");
                }
                throw error; // Stop execution.
            }
        }
        
        async function callGeminiWithRetries(prompt, withGrounding = false, maxRetries = 3) {
            let attempt = 0;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };
            if (withGrounding) { payload.tools = [{ "google_search": {} }]; }

            while (attempt < maxRetries) {
                try {
                    const response = await fetch(GEMINI_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`API call failed with status: ${response.status}`);
                    const result = await response.json();
                    return result.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I couldn't get a response.";
                } catch (error) {
                    console.error(`Gemini API call attempt ${attempt + 1} failed:`, error);
                    attempt++;
                    if (attempt >= maxRetries) return "The AI assistant is unavailable.";
                    await new Promise(res => setTimeout(res, Math.pow(2, attempt) * 1000));
                }
            }
        }

        function listenForMessages() {
            const messagesRef = collection(db, `/artifacts/${appId}/public/data/messages`);
            const q = query(messagesRef);

            onSnapshot(q, (querySnapshot) => {
                const allMessages = [];
                querySnapshot.forEach((doc) => allMessages.push({ id: doc.id, ...doc.data() }));
                allMessages.sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));
                currentMessages = allMessages;
                renderMessages(currentMessages);
            }, (error) => {
                console.error("Error listening for messages:", error);
                displayError("Connection to chat lost.");
            });
        }
        
        function renderMessages(messages) {
             chatMessages.innerHTML = '';
             if (messages.length === 0) {
                 chatMessages.innerHTML = `<div class="text-center text-slate-400">No messages yet. Say hello or try <code>/ai</code>!</div>`;
                 return;
             }
             messages.forEach(msg => displayMessage(msg));
        }
        
        function displayMessage(msg) {
             const messageElement = document.createElement('div');
             
             if(msg.type === 'system') {
                messageElement.className = 'system-message';
                messageElement.textContent = msg.text;
             } else {
                const isCurrentUser = msg.userId === userId;
                const isBot = msg.username?.includes('✨');
                messageElement.className = `flex mb-4 items-end ${isCurrentUser ? 'justify-end' : 'justify-start'}`;

                let bubbleClass, authorName;

                if (isCurrentUser) {
                   bubbleClass = 'bg-blue-500 text-white';
                   authorName = '';
                } else if (isBot) {
                   bubbleClass = 'bg-indigo-100 text-indigo-900 border border-indigo-200';
                   authorName = `<div class="flex items-center gap-2 text-xs text-indigo-500 mb-1 ml-2 font-semibold">${msg.username || 'AI'}</div>`;
                } else {
                   bubbleClass = 'bg-slate-200 text-slate-800';
                   authorName = `<div class="text-xs text-slate-500 mb-1 ml-2">${msg.username || 'Anonymous'}</div>`;
                }

                messageElement.innerHTML = `
                   <div class="max-w-xs md:max-w-md lg:max-w-lg">
                       ${authorName}
                       <div class="${bubbleClass} rounded-2xl p-3 shadow-sm">
                           <p class="text-sm whitespace-pre-wrap">${msg.text}</p>
                       </div>
                   </div>
               `;
             }
             chatMessages.appendChild(messageElement);
             chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function handleMessageSubmit(e) {
            e.preventDefault();
            const messageText = messageInput.value.trim();
            if (!messageText || !username || !userId) return;
            
            messageInput.value = '';

            if (messageText.startsWith('/ai ')) {
                const prompt = messageText.substring(4).trim();
                await addMessageToDb({text: messageText}); 
                handleAiPrompt(prompt);
            } else {
                await addMessageToDb({text: messageText});
            }
        }
        
        async function handleAiPrompt(prompt) {
             if (!prompt) return;
             const thinkingMessage = { text: 'Thinking...', username: '✨ AI Assistant', userId: 'ai-bot-thinking' };
             displayMessage(thinkingMessage); 
             
             const response = await callGeminiWithRetries(prompt, true);
             
             await addMessageToDb({text: response, username: '✨ AI Assistant', userId: 'ai-bot'});
        }

        async function handleSummarize() {
            if (currentMessages.length < 3) { return; }
            summarizeBtn.disabled = true;
            summarizeBtn.innerHTML = '<div class="ai-spinner mx-auto"></div>';
            
            const conversation = currentMessages
                .filter(msg => !msg.username?.includes('✨') && msg.type !== 'system')
                .map(msg => `${msg.username}: ${msg.text}`)
                .join('\n');

            const prompt = `Provide a brief, bulleted summary of this chat:\n\n${conversation}`;
            const summary = await callGeminiWithRetries(prompt);
            await addMessageToDb({text: summary, username: '✨ Summary Bot', userId: 'summary-bot'});
            summarizeBtn.disabled = false;
            summarizeBtn.innerHTML = '✨ Summarize';
        }

        async function addMessageToDb({text, fromUser = username, fromUserId = userId, type = 'user'}) {
             try {
                const messagesRef = collection(db, `/artifacts/${appId}/public/data/messages`);
                await addDoc(messagesRef, {
                    text: text,
                    username: fromUser,
                    userId: fromUserId,
                    timestamp: serverTimestamp(),
                    type: type,
                });
            } catch (error) {
                console.error("Error sending message:", error);
            }
        }

        async function handleUsernameSubmit(e) {
            e.preventDefault();
            const chosenUsername = usernameInput.value.trim();
            if (chosenUsername) {
                username = chosenUsername;
                usernameModal.classList.add('opacity-0');
                setTimeout(() => usernameModal.style.display = 'none', 300);
                
                userInfo.innerHTML = `
                    <div class="text-sm text-slate-300">Logged in as:</div>
                    <div class="font-semibold">${username}</div>
                `;
                listenForMessages();
                // **NEW FEATURE**: Announce user has joined
                await addMessageToDb({text: `${username} has joined the chat.`, type: 'system'});
            }
        }
        
        function displayError(message) {
            const container = document.getElementById('app-container');
            container.innerHTML = `<div class="m-auto text-center p-8">
                <h2 class="text-xl font-bold text-red-600">An Error Occurred</h2>
                <p class="text-slate-600 mt-2">${message}</p>
            </div>`;
        }
        
        // --- Event Listeners ---
        messageForm.addEventListener('submit', handleMessageSubmit);
        usernameForm.addEventListener('submit', handleUsernameSubmit);
        summarizeBtn.addEventListener('click', handleSummarize);
        
        // --- Start the App ---
        initialize();

    </script>
</body>
</html>
